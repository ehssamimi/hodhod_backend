name: Backend CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run unit and release tests
        run: npm test

      - name: Prepare PostgreSQL image
        run: docker pull postgres:17-alpine

      - name: Run database, migration, and backup/restore tests
        run: npm run test:db

      - name: Build the production image
        run: docker build --tag hodhod-backend:${{ github.sha }} .

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: hodhod-production
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy tested commit
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9._:-]+$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && git fetch --no-tags origin '$RELEASE_SHA' && git show '$RELEASE_SHA:scripts/deploy.sh' | bash -s -- '$RELEASE_SHA'"
