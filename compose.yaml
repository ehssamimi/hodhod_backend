services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hodhod
      POSTGRES_PASSWORD: hodhod_local_only
      POSTGRES_DB: hodhod
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hodhod -d hodhod"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
